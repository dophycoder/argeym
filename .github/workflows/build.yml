name: Build ARGEYM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Fix build.gradle.kts – Kotlin DSL versionCode/versionName + jvmTarget
        run: |
          GRADLE_FILE="android/app/build.gradle.kts"
          sed -i 's/jvmTarget = JavaVersion\.VERSION_17\.toString()/jvmTarget = JvmTarget.JVM_17/g' "$GRADLE_FILE"
          if ! grep -q "import org.jetbrains.kotlin.gradle.dsl.JvmTarget" "$GRADLE_FILE"; then
            sed -i '1s/^/import org.jetbrains.kotlin.gradle.dsl.JvmTarget\n/' "$GRADLE_FILE"
          fi
          sed -i 's/versionCode = flutter\.versionCode$/versionCode = flutter.versionCode()/g' "$GRADLE_FILE"
          sed -i 's/versionName = flutter\.versionName$/versionName = flutter.versionName()/g' "$GRADLE_FILE"
          echo "--- Patched $GRADLE_FILE ---"
          cat "$GRADLE_FILE"

      - run: flutter pub get

      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS IPA (unsigned, Sideloadly-ready)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build iOS app bundle (no codesign)
        run: |
          flutter build ios --release --no-codesign

      - name: Archive with xcodebuild (CODE_SIGNING_ALLOWED=NO)
        run: |
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/argeym.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/argeym.xcarchive/Products/Applications" -name "*.app" | head -1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r argeym-unsigned.ipa Payload
          ls -lh argeym-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: argeym-unsigned.ipa
