name: AR Shooter Cross-Platform Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Native Host Projects
        run: flutter create --org com.argeym --project-name argeym --platforms=ios,android .
      - name: Inject iOS Camera Permission
        run: |
          PLIST=ios/Runner/Info.plist
          DESC="Argeym uses the rear camera to render the live augmented-reality battlefield and align targets in real time."
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription $DESC" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string $DESC" "$PLIST"
      - name: Resolve Dependencies
        run: flutter pub get
      - name: Build iOS
        run: flutter build ios --release --no-codesign
      - name: Package Unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ipa/Payload/Runner.app
          cd build/ipa
          zip -r -q app-release.ipa Payload
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: build/ipa/app-release.ipa

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Native Host Projects
        run: flutter create --org com.argeym --project-name argeym --platforms=ios,android .
      - name: Inject Android Camera Permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <application#' "$MANIFEST"
          fi
      - name: Patch Plugin compileSdk
        run: |
          if [ -f android/build.gradle.kts ]; then
            printf 'subprojects {\n    pluginManager.withPlugin("com.android.library") {\n        (extensions.getByName("android") as com.android.build.gradle.BaseExtension).compileSdkVersion(34)\n    }\n    pluginManager.withPlugin("com.android.application") {\n        (extensions.getByName("android") as com.android.build.gradle.BaseExtension).compileSdkVersion(34)\n    }\n}\n\n' | cat - android/build.gradle.kts > android/build.gradle.kts.tmp && mv android/build.gradle.kts.tmp android/build.gradle.kts
          fi
          if [ -f android/build.gradle ]; then
            printf 'subprojects {\n    pluginManager.withPlugin("com.android.library") {\n        android { compileSdkVersion 34 }\n    }\n    pluginManager.withPlugin("com.android.application") {\n        android { compileSdkVersion 34 }\n    }\n}\n\n' | cat - android/build.gradle > android/build.gradle.tmp && mv android/build.gradle.tmp android/build.gradle
          fi
      - name: Resolve Dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
